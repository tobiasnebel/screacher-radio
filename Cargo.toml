[package]
name = "screacher-radio"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
fltk = { version = "1.5", default-features = false, features = ["no-images", "no-pango"] }
interprocess = { version = "2.4", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = { version = "2", features = ["serde"] }

[build-dependencies]
png = "0.18"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
x11 = { version = "2.21", features = ["xlib"] }

[profile.release]
lto = "thin"
strip = true
