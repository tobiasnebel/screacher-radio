name: Build binaries

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  SCREACHER_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
  SCREACHER_COMMIT_SHA: ${{ github.sha }}

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: cargo +stable-x86_64-pc-windows-msvc test --release --locked

      - name: Build
        run: cargo +stable-x86_64-pc-windows-msvc build --release --locked

      - name: Name the executable
        run: Copy-Item target/release/screacher-radio.exe screacher-radio-windows-x86_64.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: screacher-radio-windows-x86_64.exe
          archive: false
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build in Docker
        run: >-
          docker build
          --build-arg SCREACHER_RELEASE_TAG --build-arg SCREACHER_COMMIT_SHA
          --output type=local,dest=dist/linux .

      - name: Package the executable
        run: tar -czf screacher-radio-linux-x86_64.tar.gz -C dist/linux screacher-radio

      - name: Upload Linux archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: screacher-radio-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error

  publish:
    name: Attach binaries to the release
    if: github.event_name == 'release'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screacher-radio-windows-x86_64.exe
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screacher-radio-linux-x86_64.tar.gz
          path: release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          existing=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' -- "$RELEASE_TAG")
          files=()
          for name in screacher-radio-windows-x86_64.exe screacher-radio-linux-x86_64.tar.gz; do
            if ! grep -Fxq -- "$name" <<< "$existing"; then
              files+=("release-assets/$name")
            fi
          done
          if (( ${#files[@]} )); then
            gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" "${files[@]}"
          fi
